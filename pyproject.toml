[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-bot"
version = "0.1.0"
description = "Telegram finance bot with webhook and JSON expense API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.30,<4",
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.128,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "redis>=7.1,<8",
    "sqlalchemy[asyncio]>=2.0.46,<3",
    "structlog>=25.5,<26",
    "tzdata>=2025.3",
    "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "httpx>=0.28,<1",
    "mypy>=1.19,<2",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
